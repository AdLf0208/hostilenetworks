[mod]
id = "hostilenetworks"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "1d63e0a5a37a7a708eb0b32b49bf0dfeb28ed8a9"

# The pure model/tier/chamber/fabricator logic (standalone crate lib, injected
# as `crate::game::hostilenetworks`).
# The content half is inside this bundle (`data/hostilenetworks-content.hmod`, the built
# `content/hostilenetworks.hmod`): this writes it to `.horizon-cache/` and appends it to the
# dev-mod list, so one `.hnmod` installs the content and the code. The registry
# keeps one file per project, so a split port could not be listed; AE2 ships the
# same pattern.
[[injection]]
id = "embedded-content"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::mods::content_root"
helper = "embedded_content.rs"
bindings = [
  { name = "root", ty = "&std::path::Path", value = "root" },
  { name = "enabled", ty = "&std::collections::BTreeSet<String>", value = "enabled" },
  { name = "dev", ty = "&[std::path::PathBuf]", value = "dev" },
]

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "hostilenetworks"
source = "runtime.rs"

# Game-side glue: block entities, item components, the menus' screens and the
# `/hostilenetworks` commands.
[[module]]
id = "state"
file = "crates/horizon-client/src/game.rs"
name = "hostilenetworks_state"
source = "support.rs"

# Before content loads: register the components a Data Model and a Prediction
# carry (`native_component_types`, API 65).
[[injection]]
id = "component-types"
hook = "component_types"
hook_version = 1
kind = "HEAD"
helper = "component_types.rs"
bindings = [
  { name = "types", ty = "&mut Vec<String>", value = "types" },
]

# The two machines declare block entities (`native_block_entity`, API 15).
[[injection]]
id = "block-entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "entity" },
]

# ... and tick (`native_block_entity_ticks`, API 15).
[[injection]]
id = "block-entity-ticks"
hook = "block_entity_ticks"
hook_version = 1
kind = "HEAD"
helper = "block_entity_ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "ticks" },
]

# The chamber's 4 slots and the fabricator's 17, each with its own menu type
# (`native_block_entity_container`, API 16/17).
[[injection]]
id = "block-entity-container"
hook = "block_entity_container"
hook_version = 1
kind = "HEAD"
helper = "block_entity_container.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "container", ty = "&mut Option<horizon_client::containers::ModContainer>", value = "container" },
]

# ... and a FE buffer each (`native_block_entity_energy`, API 142): the amount
# lives in the block entity's saved compound as the int `energy`.
[[injection]]
id = "block-entity-energy"
hook = "block_entity_energy"
hook_version = 1
kind = "HEAD"
helper = "block_entity_energy.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "energy", ty = "&mut Option<horizon_client::containers::ModEnergyBuffer>", value = "energy" },
]

# The run and the fabrication, once per tick.
[[injection]]
id = "block-entity-tick"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "block_entity_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "entity" },
]

# The chamber's 4-slot screen layout (`native_screen`, API 19).
[[injection]]
id = "screen"
hook = "screen"
hook_version = 1
kind = "HEAD"
helper = "screen.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "screen", ty = "&mut Option<NativeScreen>", value = "screen" },
]

# ... the energy, progress and tier text over it.
[[injection]]
id = "screen-draw"
hook = "screen_draw"
hook_version = 1
kind = "HEAD"
helper = "screen_draw.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "block", ty = "&str", value = "block" },
  { name = "data", ty = "&[i32]", value = "data" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "batch" },
  { name = "origin", ty = "[f32; 2]", value = "origin" },
]

# A press on the fabricator's drop palette, or the chamber's mode line, names
# the menu button the game sends to the server (`native_screen_click`, API 20).
[[injection]]
id = "screen-click"
hook = "screen_click"
hook_version = 1
kind = "HEAD"
helper = "screen_click.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "data", ty = "&[i32]", value = "data" },
  { name = "at", ty = "[f32; 2]", value = "at" },
  { name = "right", ty = "bool", value = "right" },
  { name = "button", ty = "&mut Option<i32>", value = "button" },
]

# The server applies that button to the block entity (`native_menu_button`,
# API 20).
[[injection]]
id = "menu-button"
hook = "menu_button"
hook_version = 1
kind = "HEAD"
helper = "menu_button.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "entity" },
  { name = "id", ty = "i32", value = "id" },
]

# `/hostilenetworks info|energy|model|fab`: the harness controls the ladder of
# this slice needs (there is no other way to charge a machine or type a model
# headlessly).
[[injection]]
id = "register-commands"
hook = "register_commands"
hook_version = 1
kind = "HEAD"
helper = "register_commands.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<NativeCommand>", value = "commands" },
]

[[injection]]
id = "perform-command"
hook = "perform_command"
hook_version = 1
kind = "HEAD"
helper = "perform_command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "&NativeServerPlayer", value = "player" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "ran" },
]
